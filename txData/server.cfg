# This file is a minimal version of the default config file.
# This is NOT supposed to be enough for a fully running server.
# Please read the fivem documentation:
#   https://aka.cfx.re/server-commands
#   https://docs.fivem.net/docs/server-manual/setting-up-a-server/

## You CAN edit the following:
endpoint_add_tcp "0.0.0.0:30120"
endpoint_add_udp "0.0.0.0:30120"
sv_maxclients 48
sv_enforceGameBuild 2944 #mp2023_01 - San Andreas Mercenaries
## [txAdmin CFG validator]: onesync MUST only be set in the txAdmin settings page.
# set onesync on
sets tags "qbcore, roleplay, testing, local4word6"
# Local test server: do not publish to the Cfx.re master list.
sv_master1 ""

## QBCore / ProjectTerrific settings
setr qb_locale "en"
setr UseTarget true

## Voice / pma-voice settings
setr voice_useNativeAudio 1
setr voice_useSendingRangeOnly 1
setr voice_zoneRadius 300
setr voice_use3dAudio true
setr voice_enableUi 1
setr voice_enableProximityCycle 1
setr voice_enableRadios 1
setr voice_enablePhones 1
setr voice_defaultVolume 1
setr voice_enableSubmix 1
setr voice_defaultCycle "GRAVE"
setr voice_defaultRadio "CAPITAL"
setr voice_syncData 1
setr voice_enableRadioAnim 1

## Resource configuration files
exec resources/vMenu/config/permissions.cfg

## You MAY edit the following:
## Secrets (license key, DB connection, API keys) live in secrets.cfg, which is git-ignored.
exec secrets.cfg
sv_hostname "Vinewood Nights"
sets sv_projectName "Vinewood Nights"
sets sv_projectDesc "Vinewood Nights - polski serwer roleplay QBCore. Praca, domy, pojazdy i ekonomia."
sets locale "pl-PL"

## These resources will start by default.
ensure mapmanager
ensure chat
ensure spawnmanager
ensure sessionmanager
ensure basic-gamemode
ensure hardcap
ensure baseevents
ensure wk_delveh
ensure vMenu
ensure jg-vehicleindicators
# ESX car keys resource is installed in resources/[local]/ts_esx-CarKeys.
# It requires es_extended, oxmysql, and an owned_vehicles database table before enabling.
# lachee-garage is installed in resources/[local]/lachee-garage.
# It is an older ESX garage resource and currently requires mysql-async plus its SQL migrations.
# ensure oxmysql
# ensure es_extended
# ensure ts_esx-CarKeys
# ensure lachee-garage

## ProjectTerrific QBCore stack
exec projectterrific.cfg

ensure vineryardH
ensure vremastered
# speedometer resource is not present in txData/resources.
# ensure speedometer


## Vehicle resources
exec resources/[addon]/vehicles.cfg

## Add system admins
add_ace group.admin command allow # allow all commands
add_ace group.admin command.quit deny # but don't allow quit
add_principal identifier.fivem:11505177 group.admin #Srtoki_Wenn
add_principal identifier.license:c44f2f65a53bffa9940d88d94f40c1120913fa93 group.admin #QuickCrab6016
add_principal identifier.license2:c44f2f65a53bffa9940d88d94f40c1120913fa93 group.admin #QuickCrab6016

